name: Release macOS installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified rclone binary
        run: npm run download-rclone

      - name: Build renderer and main process
        run: npm run build

      - name: Build unsigned macOS DMG installer
        run: npx electron-builder --mac --publish never

      - name: Upload DMG to Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg_file=$(find dist-packaged -name "LabSuite-v*.dmg" | head -n 1)
          if [ -z "$dmg_file" ]; then
            echo "macOS DMG installer was not generated."
            exit 1
          fi
          echo "Found DMG installer: $dmg_file"
          
          # Try uploading to existing release; if it fails (release doesn't exist yet), create it
          gh release upload '${{ github.ref_name }}' "$dmg_file" --clobber || \
          gh release create '${{ github.ref_name }}' "$dmg_file" --title 'LabSuite ${{ github.ref_name }}' --notes 'Multi-platform Release'
